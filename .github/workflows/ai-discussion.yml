name: AI discussion

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue or pull request number
        required: true
        type: string
      rounds:
        description: Number of exchanges before the summary
        default: '1'
        type: choice
        options: ['1', '2']

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ai-discussion-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  discuss:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.comment.user.type == 'User' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/ai-discuss'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify discussion controller
        run: node --test automation/tests/discuss.test.mjs
      - name: Run discussion
        run: node automation/discuss.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-astra' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
