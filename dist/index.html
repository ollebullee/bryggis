  <meta property="og:site_name" content="Bryggis">

  <meta property="og:image" content="https://stammis-kaffe-olle.ollekallgren117.chatgpt.site/og-image.png">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="app-icon.png">
  <script src="app.js" type="module"></script>
</head>
<body>
  <dialog id="app-intro" class="app-intro" aria-label="Bryggis öppnas">
    <div class="intro-lockup" aria-hidden="true">
      <img class="intro-mark" src="bryggis-logo.png" width="104" height="104" alt="">
      <p class="intro-brand">bryggis<span>.</span></p>
      <p class="intro-caption">Kaffe hos ditt lokala kafé.</p>
    </div>
    <button type="button" class="intro-skip" autofocus>Hoppa över</button>
  </dialog>
  <script>
    // Show once, only after the first home view is ready. Never gate a deep link.
    (() => {
      const intro = document.getElementById('app-intro');
      const seenKey = 'bryggis-intro-seen-v1';
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const seen = () => {
        try { return localStorage.getItem(seenKey) === '1'; }
        catch { return true; } // Skip when the preference cannot be persisted.
      };
      if (seen() || reducedMotion.matches || typeof intro.showModal !== 'function') {
        intro.remove();
        return;
      }
      let shown = false;
      let leaving = false;
      let timer;
      let exitTimer;
      const finish = () => {
        window.clearTimeout(timer);
        window.clearTimeout(exitTimer);
        document.removeEventListener('bryggis:navigate', onNavigate);
        reducedMotion.removeEventListener('change', onMotionChange);
        if (!intro.isConnected) return;
        const restoreFocus = intro.contains(document.activeElement);
        if (intro.open) intro.close();
        intro.remove();
        if (restoreFocus) document.querySelector('#main h1')?.focus({preventScroll: true});
      };
      const dismiss = () => {
        if (leaving) return;
        leaving = true;
        window.clearTimeout(timer);
        intro.classList.add('intro-leaving');
        exitTimer = window.setTimeout(finish, 150);
      };
      const onMotionChange = event => { if (event.matches) finish(); };
      const onNavigate = event => {
        if (event.detail?.page !== 'hem') {
          if (shown) finish();
          return;
        }
        if (shown) return;
        if (seen()) { finish(); return; }
        try { localStorage.setItem(seenKey, '1'); }
        catch { finish(); return; }
        shown = true;
        try { intro.showModal(); }
        catch { finish(); return; }
        timer = window.setTimeout(dismiss, 500);
      };
      intro.querySelector('button').addEventListener('click', dismiss);
      intro.addEventListener('cancel', event => {
        event.preventDefault();
        dismiss();
      });
      document.addEventListener('bryggis:navigate', onNavigate);
      reducedMotion.addEventListener('change', onMotionChange);
    })();
  </script>
  <a class="skip-link" href="#main">Till innehållet</a>
  <header class="topbar">
    <a class="wordmark" href="#hem" aria-label="Bryggis, hem"><img class="brand-icon" src="bryggis-logo.png" width="40" height="40" alt="">bryggis<span class="brand-dot">.</span></a>
    <div class="mode-switch" role="group" aria-label="Välj vy">
      <button type="button" data-action="customer" id="customer-mode">Kundvy</button>
      <button type="button" data-action="staff" id="staff-mode">Personalvy</button>
    </div>
  </header>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Huvudmeny">
      <nav id="desktop-nav"></nav>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <nav id="mobile-nav" class="mobile-nav" aria-label="Mobilmeny"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="connection-banner" class="connection-banner" role="status" hidden>Du är offline. Endast lokala demodata visas och sparas på den här enheten.</div>
  <div id="modal-root"></div>
</body>
</html>
